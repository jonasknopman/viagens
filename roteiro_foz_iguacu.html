<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Foz do Iguaçu — guia de viagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg: #17181b;
    --bg-elev: #201f22;
    --bg-elev-2: #29282c;
    --ink: #f2efe9;
    --ink-dim: #aeaba3;
    --ink-faint: #7c7a76;
    --line: rgba(242,239,233,.10);
    --line-strong: rgba(242,239,233,.18);
    --select: #ffd166;
    --select-ink: #201a06;

    --c-atracoes: #ef6f6f;
    --c-compras: #ac93d1;
    --c-hospedagem: #93a9b6;
    --c-restaurantes: #e0a83a;

    --radius: 16px;
    --radius-sm: 10px;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,209,102,.05), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom: 40px;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 18px; }

  h1,h2,h3, .disp{ font-family:'Space Grotesk', 'Inter', sans-serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- header ---------- */
  header{ padding:34px 0 18px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:.16em;
    color: var(--select);
    text-transform:uppercase;
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:"";
    width:22px; height:1px; background: var(--select);
    display:inline-block;
  }
  header h1{
    font-size: clamp(26px, 4.6vw, 38px);
    line-height:1.12;
    font-weight:700;
    margin:0 0 12px;
    max-width: 17ch;
  }
  header p{
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink-dim);
    max-width:52ch;
    margin:0;
  }

  /* ---------- map ---------- */
  .map-wrap{ position:relative; margin-top:22px; }
  #map{
    height: 340px;
    border-radius: var(--radius);
    border:1px solid var(--line-strong);
    background:var(--bg-elev);
  }
  @media (max-width:640px){ #map{ height:280px; } }

  .map-controls{
    position:absolute; top:12px; right:12px; z-index:1200;
    display:flex; flex-direction:column; gap:8px;
  }
  .map-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--bg-elev-2); border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.4);
    transition: all .15s ease;
  }
  .map-btn svg{ width:18px; height:18px; }
  .map-btn:hover{ background:var(--bg-elev); border-color:var(--select); color:var(--select); }
  .map-btn.busy{ opacity:.45; pointer-events:none; }

  .leaflet-popup-content-wrapper{
    background:var(--bg-elev-2); color:var(--ink);
    border-radius:12px; border:1px solid var(--line-strong);
  }
  .leaflet-popup-tip{ background:var(--bg-elev-2); }
  .leaflet-popup-content{ margin:12px 14px; font-family:'Inter',sans-serif; }
  .pop-cat{ display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; margin-bottom:4px;}
  .pop-cat img{ width:12px; height:12px; object-fit:contain; }
  .pop-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; margin-bottom:6px; }
  .pop-desc{ font-size:12.5px; line-height:1.45; color:var(--ink-dim); margin-bottom:10px; }
  .pop-route{
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em;
    border:1px solid var(--line-strong); background:transparent; color:var(--ink);
    padding:8px 12px; border-radius:8px; text-decoration:none;
    transition: all .15s ease;
  }
  .pop-route:hover{ background:var(--select); color:var(--select-ink); border-color:var(--select); }
  .pop-route svg{ width:13px; height:13px; }
  .leaflet-container a.leaflet-popup-close-button{ color:var(--ink-dim); }

  /* ---------- controls (sticky) ---------- */
  .controls{
    position:sticky; top:0; z-index:20;
    background: linear-gradient(var(--bg) 78%, transparent);
    padding:16px 0 10px;
    margin-top: 4px;
  }
  .search{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-elev); border:1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    padding:10px 14px; margin-bottom:12px;
  }
  .search svg{ flex:none; opacity:.55; }
  .search input{
    background:none; border:none; outline:none; color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14.5px; width:100%;
  }
  .search input::placeholder{ color:var(--ink-faint); }

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none;
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; letter-spacing:.02em;
    color:var(--ink-dim);
    background:var(--bg-elev);
    border:1px solid var(--line-strong);
    padding:8px 13px 8px 10px;
    border-radius:100px;
    cursor:pointer;
    user-select:none;
    transition: border-color .15s, color .15s, background .15s;
    white-space:nowrap;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--select); }
  .chip .chip-icon{ width:14px; height:14px; object-fit:contain; flex:none; }
  .chip .count{ opacity:.6; }
  .chip.active{ color:var(--ink); background:var(--bg-elev-2); border-color:var(--line-strong); }
  .chip:hover{ border-color: var(--ink-faint); }

  /* ---------- grid / cards ---------- */
  #grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap:12px;
    margin: 14px 0 10px;
  }
  .card{
    position:relative;
    background:var(--bg-elev);
    border:1px solid var(--line);
    border-left:3px solid var(--cat-color, var(--line));
    border-radius: var(--radius-sm);
    padding:14px 14px 15px;
    cursor:pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
    animation: rise .35s ease both;
  }
  .card:hover{ background:var(--bg-elev-2); }
  .card:active{ transform: scale(.985); }
  .card-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px; margin-bottom:8px;
  }
  .cat-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color: var(--cat-color);
  }
  .cat-tag img{ width:15px; height:15px; object-fit:contain; }
  .route-btn{
    flex:none;
    width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-dim); text-decoration:none;
    transition: all .15s ease;
  }
  .route-btn svg{ width:13px; height:13px; }
  .route-btn:hover{ background:var(--select); border-color:var(--select); color:var(--select-ink); }
  .card h3{
    font-size:16px; font-weight:600; line-height:1.28;
    margin:0 0 6px;
  }
  .card p{
    font-size:13px; line-height:1.5; color:var(--ink-dim);
    margin:0;
  }
  .empty{
    grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--ink-faint);
    font-size:13.5px;
  }

  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--bg); font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:100px; z-index:50; opacity:0; pointer-events:none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Guia de Viagem · Foz do Iguaçu</div>
    <h1>Foz do Iguaçu, na palma da mão</h1>
    <p>34 pontos entre atrações, compras, hospedagem e restaurantes. Toque num cartão para ver no mapa, ou use o ícone de rota para abrir o caminho direto no Google Maps.</p>
  </header>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-controls">
      <button class="map-btn" id="locateBtn" title="Minha localização" aria-label="Minha localização">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button class="map-btn" id="resetViewBtn" title="Ver todos os pontos" aria-label="Ver todos os pontos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v6h6M20 10V4h-6M4 10V4h6M20 14v6h-6"/></svg>
      </button>
    </div>
  </div>

  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar por nome…" />
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="grid"></div>
</div>

<div class="toast" id="toast">Não foi possível obter sua localização</div>

/* ===================== estado ===================== */
let activeCat = "todos";
let searchTerm = "";
const markers = {};

/* ===================== helpers ===================== */
function buildChips(){
  const wrap = document.getElementById('chips');
  const counts = {};
  DATA.forEach(d => counts[d.cat] = (counts[d.cat]||0)+1);

  const all = document.createElement('div');
  all.className = 'chip active';
  all.dataset.cat = 'todos';
  all.innerHTML = `<span class="dot"></span>Todos <span class="count">${DATA.length}</span>`;
  wrap.appendChild(all);

  Object.keys(CATS).forEach(key=>{
    const c = CATS[key];
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.cat = key;
    el.innerHTML = `<img class="chip-icon" src="${c.icon}" alt=""/>${c.label} <span class="count">${counts[key]||0}</span>`;
    wrap.appendChild(el);
  });

  wrap.addEventListener('click', e=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    activeCat = chip.dataset.cat;
    [...wrap.children].forEach(c=>c.classList.toggle('active', c===chip));
    renderCards();
  });
}

function matches(item){
  const catOk = activeCat === 'todos' || item.cat === activeCat;
  const term = searchTerm.trim().toLowerCase();
  const searchOk = !term || item.name.toLowerCase().includes(term);
  return catOk && searchOk;
}

function renderCards(){
  const grid = document.getElementById('grid');
  const list = DATA.filter(matches);
  if(list.length === 0){
    grid.innerHTML = `<div class="empty">Nenhum ponto encontrado com esse filtro.</div>`;
    return;
  }
  grid.innerHTML = list.map(item=>{
    const cat = CATS[item.cat];
    return `
      <div class="card" data-id="${item.id}" style="--cat-color:${cat.color}">
        <div class="card-top">
          <span class="cat-tag"><img src="${cat.icon}" alt=""/>${cat.label}</span>
          <a class="route-btn" href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lon}" target="_blank" rel="noopener" aria-label="Rota no Google Maps" title="Rota no Google Maps">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          </a>
        </div>
        <h3>${item.name}</h3>
        <p>${item.desc}</p>
      </div>`;
  }).join('');
}

document.getElementById('grid').addEventListener('click', e=>{
  if(e.target.closest('.route-btn')) return;
  const card = e.target.closest('.card');
  if(!card) return;
  const id = Number(card.dataset.id);
  const marker = markers[id];
  if(marker){
    map.setView(marker.getLatLng(), 17);
    marker.openPopup();
    document.getElementById('map').scrollIntoView({behavior:'smooth', block:'center'});
  }
});

document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value;
  renderCards();
});

/* ===================== mapa ===================== */
const map = L.map('map', { scrollWheelZoom:false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 19
}).addTo(map);

function markerIcon(cat){
  const c = CATS[cat];
  return L.icon({
    iconUrl: c.icon,
    iconSize: c.markerSize,
    iconAnchor: c.markerAnchor,
    popupAnchor: c.popupAnchor
  });
}

const latlngs = [];
DATA.forEach(item=>{
  const m = L.marker([item.lat, item.lon], { icon: markerIcon(item.cat) }).addTo(map);
  const popupHtml = `
    <div class="pop-cat"><img src="${CATS[item.cat].icon}" alt=""/>${CATS[item.cat].label}</div>
    <div class="pop-name">${item.name}</div>
    <div class="pop-desc">${item.desc}</div>
    <a class="pop-route" href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lon}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      Rota no Google Maps
    </a>`;
  m.bindPopup(popupHtml);
  markers[item.id] = m;
  latlngs.push([item.lat, item.lon]);
});
const initialBounds = L.latLngBounds(latlngs);
map.fitBounds(initialBounds, { padding:[26,26] });

/* ===================== controles do mapa ===================== */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

let userMarker = null;
document.getElementById('locateBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('locateBtn');
  if(!navigator.geolocation){ showToast('Geolocalização não é suportada neste navegador'); return; }
  btn.classList.add('busy');
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.classList.remove('busy');
    const { latitude, longitude } = pos.coords;
    if(userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([latitude, longitude], {
      radius:8, color:'#ffffff', weight:2, fillColor:'#4285F4', fillOpacity:1
    }).addTo(map);
    map.setView([latitude, longitude], 17);
  }, err=>{
    btn.classList.remove('busy');
    showToast('Não foi possível obter sua localização');
  }, { enableHighAccuracy:true, timeout:10000 });
});

document.getElementById('resetViewBtn').addEventListener('click', ()=>{
  map.fitBounds(initialBounds, { padding:[26,26] });
});

/* ===================== init ===================== */
buildChips();
renderCards();
</script>
